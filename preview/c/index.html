<style>
/* Direction C: Visual. Team colours carry the page; every pick is a probability bar, TD scorers are a ranked chart, parlays are leg chips. */
:root {
  --bg: #f3f4f8; --card: #ffffff; --ink: #0f1222; --muted: #646a80; --line: #e3e5ee; --track: #eceef5;
  --win: #12a150; --loss: #e5484d; --sans: "Space Grotesk", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace;
  --a: #00338d; --h: #4f2683;
}
@media (prefers-color-scheme: dark) { :root { --bg: #0d0f17; --card: #161927; --ink: #eef0f8; --muted: #9aa0b8; --line: #262a3d; --track: #23273a; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
.wrap { max-width: 1160px; margin: 0 auto; padding: 16px 16px 60px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(var(--a) 0 50%, var(--h) 50% 100%); }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font: 600 13px/1 var(--sans); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.hero { margin-top: 16px; border-radius: 24px; padding: 26px; color: #fff; background: linear-gradient(110deg, var(--a) 0%, var(--a) 42%, var(--h) 58%, var(--h) 100%); display: grid; gap: 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 120% at 50% 120%, rgba(255,255,255,.18), transparent 60%); pointer-events: none; }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; }
.teams .t { display: grid; gap: 2px; }
.teams .t.r { text-align: right; }
.teams small { font: 500 11px/1 var(--mono); letter-spacing: .1em; opacity: .8; }
.teams b { font: 700 clamp(26px, 5vw, 46px)/1 var(--sans); letter-spacing: -.02em; }
.teams .mid { font: 500 12px/1 var(--mono); opacity: .8; text-align: center; }
.win-meter { display: grid; gap: 6px; }
.win-meter .track { height: 12px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; display: flex; }
.win-meter .track i { background: #fff; }
.win-meter div:last-child { display: flex; justify-content: space-between; font: 500 12px/1 var(--mono); }
.hero p { margin: 0; max-width: 70ch; opacity: .95; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.kpi small { color: var(--muted); font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.kpi b { display: block; font-size: 26px; margin-top: 6px; letter-spacing: -.02em; }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.pick:first-of-type { border-top: 0; }
.pick b { font-weight: 600; }
.pick .px { font: 500 15px/1 var(--mono); text-align: right; }
.pick .bar { grid-column: 1 / -1; height: 10px; border-radius: 999px; background: var(--track); position: relative; overflow: hidden; }
.pick .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--a), var(--h)); }
.pick .bar u { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--card); }
.pick .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 500 12px/1 var(--mono); color: var(--muted); }
.res { font: 500 11px/1 var(--mono); padding: 3px 7px; border-radius: 999px; background: var(--track); color: var(--muted); }
.res.win { background: color-mix(in srgb, var(--win) 18%, transparent); color: var(--win); }
.res.loss { background: color-mix(in srgb, var(--loss) 18%, transparent); color: var(--loss); }
.tdchart { display: grid; gap: 8px; }
.tdc { display: grid; grid-template-columns: 130px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13px; }
.tdc .bar { height: 18px; border-radius: 6px; background: var(--track); overflow: hidden; }
.tdc .bar i { display: block; height: 100%; background: color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 6px; }
.tdc.pick-td .bar i { background: linear-gradient(90deg, var(--a), var(--h)); }
.tdc.pick-td span:first-child { font-weight: 700; }
.tdc span:last-child { font-family: var(--mono); text-align: right; }
.pars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.par { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; align-content: start; justify-items: start; }
.par .row { justify-self: stretch; }
.par small { color: var(--muted); font: 500 11px/1 var(--mono); }
.par b { font-size: 30px; letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 6px 8px; border-radius: 8px; background: var(--track); }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--h) calc(var(--p) * 1%), var(--track) 0); display: grid; place-items: center; font: 500 11px/1 var(--mono); }
.ring span { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.row { display: flex; justify-content: space-between; align-items: center; }
.fine { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .pars, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .tdc { grid-template-columns: 100px minmax(0, 1fr) 48px; } .hero { padding: 20px; } }
</style>
