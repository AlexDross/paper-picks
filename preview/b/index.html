<style>
/* Direction B: Editorial. A Sunday sports section: warm newsprint, big serif headline, numbered picks in a column, a sidebar of parlays. */
:root {
  --bg: #f6f1e7; --paper: #fbf8f1; --ink: #1d1a16; --muted: #6d655a; --rule: #d9cfbd; --red: #b3261e; --green: #2f6b3a;
  --serif: "Fraunces", Georgia, serif; --sans: "Source Sans 3", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root { --bg: #17140f; --paper: #1e1a14; --ink: #efe8da; --muted: #a59b8b; --rule: #3a3328; --red: #ef6b5e; --green: #7fc28b; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--sans); }
.page { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }
.mast { text-align: center; padding: 26px 0 12px; border-bottom: 3px double var(--rule); }
.mast h1 { font: 800 clamp(34px, 7vw, 64px)/1 var(--serif); letter-spacing: -.02em; margin: 0; }
.mast .dateline { display: flex; justify-content: space-between; font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 14px; flex-wrap: wrap; gap: 8px; }
.games { display: flex; gap: 0; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.games button { flex: 1 0 auto; background: none; border: 0; border-right: 1px solid var(--rule); padding: 12px 16px; text-align: left; font: inherit; color: var(--muted); cursor: pointer; }
.games button:last-child { border-right: 0; }
.games button[aria-pressed="true"] { color: var(--ink); background: var(--paper); box-shadow: inset 0 -3px 0 var(--red); }
.games b { display: block; font: 600 18px/1.2 var(--serif); }
.games small { font: 500 11px/1 var(--mono); letter-spacing: .06em; }
.story { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; padding-top: 30px; }
.kicker { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
.story h2 { font: 800 clamp(30px, 5vw, 50px)/1.04 var(--serif); letter-spacing: -.02em; margin: 10px 0 14px; }
.deck { font: 400 21px/1.45 var(--serif); color: var(--muted); margin: 0 0 22px; }
.byline { font: 500 12px/1 var(--mono); color: var(--muted); padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; gap: 16px; flex-wrap: wrap; }
.picks { list-style: none; padding: 0; margin: 24px 0 0; counter-reset: p; }
.picks li { counter-increment: p; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 14px; padding: 16px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.picks li::before { content: counter(p); font: 800 30px/1 var(--serif); color: var(--red); grid-row: span 2; }
.picks b { font: 600 22px/1.2 var(--serif); }
.picks .price { font: 600 22px/1 var(--serif); text-align: right; }
.picks small { color: var(--muted); font-size: 14px; }
.picks .res { text-align: right; font: 500 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
.res.win { color: var(--green); } .res.loss { color: var(--red); }
h3 { font: 600 13px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; margin: 40px 0 10px; padding-top: 12px; border-top: 3px solid var(--ink); }
.tdrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.tdrow div { border-left: 1px solid var(--rule); padding-left: 14px; }
.tdrow b { font: 600 24px/1.15 var(--serif); display: block; }
.tdrow span { font: 600 18px/1 var(--serif); color: var(--red); }
.tdrow small { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
aside { border-left: 1px solid var(--rule); padding-left: 28px; }
.par { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.par .band { font: 500 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.par .pr { font: 800 34px/1.1 var(--serif); }
.par ol { margin: 6px 0 4px; padding-left: 18px; font-size: 15px; }
.par small { color: var(--muted); font-size: 13px; }
.box { background: var(--paper); border: 1px solid var(--rule); padding: 16px; margin-top: 24px; }
.box h4 { font: 600 18px/1.2 var(--serif); margin: 0 0 8px; }
.box p { margin: 4px 0; font-size: 15px; display: flex; justify-content: space-between; }
.notes p { font: 400 18px/1.6 var(--serif); }
.notes p:first-child::first-letter { font: 800 52px/0.9 var(--serif); float: left; margin: 4px 8px 0 0; color: var(--red); }
.fine { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 12px; color: var(--muted); font-size: 13px; }
@media (max-width: 860px) { .story { grid-template-columns: 1fr; gap: 10px; } aside { border-left: 0; padding-left: 0; } .tdrow { grid-template-columns: 1fr; } .tdrow div { border-left: 0; padding-left: 0; border-bottom: 1px solid var(--rule); padding-bottom: 10px; } }
</style>
