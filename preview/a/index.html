<style>
/* Direction A: Sportsbook. Dark app shell, slate rail across the top, bet-slip cards with big prices and a neon accent. */
:root {
  --bg: #0b0d10; --panel: #14171c; --panel-2: #1b1f26; --line: #262b33;
  --ink: #f2f4f7; --muted: #8b93a1; --faint: #5c6370;
  --accent: #3cf2a0; --accent-ink: #04140c; --warn: #ffb547; --loss: #ff5d6c;
  --r: 16px; --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
a { color: inherit; }
.shell { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--line); }
.logo { display: flex; gap: 10px; align-items: center; font-weight: 800; letter-spacing: -.02em; font-size: 18px; }
.logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-style: normal; font-size: 14px; }
.paper { font: 700 10px/1 var(--mono); letter-spacing: .12em; color: var(--warn); border: 1px solid #4a3a1c; padding: 6px 8px; border-radius: 6px; }
.rail { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0; scrollbar-width: none; }
.chip { flex: 0 0 auto; min-width: 210px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); cursor: pointer; font: inherit; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.chip small { display: block; color: var(--muted); font-size: 11px; font-family: var(--mono); }
.chip b { display: block; margin: 4px 0 2px; font-size: 15px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.hero { background: radial-gradient(120% 140% at 0% 0%, #17322a 0%, var(--panel) 55%); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 16px; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.team { display: grid; gap: 4px; }
.team.r { text-align: right; }
.team span { font: 700 11px/1 var(--mono); color: var(--muted); letter-spacing: .1em; }
.team b { font-size: clamp(24px, 4.5vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.vs { font: 700 12px/1 var(--mono); color: var(--faint); }
.lines { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font: 700 12px/1 var(--mono); padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.tag.live { color: var(--accent); }
.headline { color: #c9d0db; font-size: 15px; margin: 0; }
h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
h2 em { font-style: normal; color: var(--faint); letter-spacing: .02em; text-transform: none; font-weight: 500; font-size: 12px; }
.slips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.slip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.slip .cat { grid-column: 1 / -1; font: 700 10px/1 var(--mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; display: flex; justify-content: space-between; }
.slip .bet { font-weight: 600; font-size: 15px; }
.odds { font: 700 18px/1 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 76px; text-align: center; }
.bar { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.pct { grid-column: 1 / -1; font: 500 11px/1 var(--mono); color: var(--muted); }
.st { font: 700 10px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: var(--panel-2); color: var(--muted); }
.st.win { background: #0f3a28; color: var(--accent); } .st.loss { background: #3a1419; color: var(--loss); }
.tds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.td { background: linear-gradient(180deg, #1c2430, var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.td b { font-size: 17px; }
.td .odds { justify-self: start; }
.side { position: sticky; top: 14px; display: grid; gap: 12px; }
.betslip { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.bs-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); font-weight: 700; }
.bs-head span { font: 700 10px/1 var(--mono); color: var(--warn); letter-spacing: .1em; }
.par { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.par:last-child { border-bottom: 0; }
.par-top { display: flex; justify-content: space-between; align-items: center; }
.par-top small { font: 700 10px/1 var(--mono); letter-spacing: .1em; color: var(--faint); }
.par-top b { font: 700 22px/1 var(--mono); color: var(--accent); }
.par ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: #c9d0db; }
.par li { display: flex; justify-content: space-between; gap: 10px; }
.par li span { font-family: var(--mono); color: var(--muted); }
.record { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; }
.rec-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.rec-row b { color: var(--ink); font-family: var(--mono); }
.fine { color: var(--faint); font-size: 12px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
.board { width: 100%; border-collapse: collapse; font-size: 13px; }
.board td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.board td:nth-child(n+2) { text-align: right; font-family: var(--mono); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
summary { cursor: pointer; font-weight: 600; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { position: static; } }
@media (max-width: 600px) { .slips, .tds { grid-template-columns: 1fr; } .chip { min-width: 180px; } }
</style>
</head>
