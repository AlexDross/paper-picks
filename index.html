<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NFL Paper Picks</title>

<style>
/* Layout: a quiet catalogue. Week shelves of game tiles on the home view; one game per view, scoreboard first, then picks, then the fine print. */
:root {
  --bg: #ffffff;
  --surface: #f4f4f5;
  --surface-2: #eaeaec;
  --ink: #18181b;
  --muted: #5d5d66;
  --faint: #8a8a93;
  --line: #e4e4e7;
  --win: #157a47;
  --win-bg: #e3f4ea;
  --loss: #b4232f;
  --loss-bg: #fbe7e8;
  --held: #8a5a00;
  --held-bg: #fbf0d9;
  --pick: #18181b;
  --pick-ink: #ffffff;
  --font-display: "Funnel Display", "Funnel Sans", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Funnel Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1d1d1f; --surface-2: #2a2a2d; --ink: #f5f5f5; --muted: #ababab; --faint: #7d7d84;
    --line: #2c2c30; --win: #5fd394; --win-bg: #133222; --loss: #ff8a8f; --loss-bg: #3a1619; --held: #f2c46b;
    --held-bg: #33270f; --pick: #f5f5f5; --pick-ink: #121212; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1d1d1f; --surface-2: #2a2a2d; --ink: #f5f5f5; --muted: #ababab; --faint: #7d7d84;
  --line: #2c2c30; --win: #5fd394; --win-bg: #133222; --loss: #ff8a8f; --loss-bg: #3a1619; --held: #f2c46b;
  --held-bg: #33270f; --pick: #f5f5f5; --pick-ink: #121212; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 6vw, 48px); font-weight: 600; line-height: 1.05; }
h2 { font-size: 20px; font-weight: 600; }
p { margin: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.brand-name { font: 600 17px/1 var(--font-display); }
.paper { font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border: 1px dashed var(--faint); border-radius: 999px; color: var(--muted); }

.intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; padding-block: 36px 28px; align-items: end; }
.intro p.lede { color: var(--muted); max-width: 52ch; margin-top: 12px; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--bg); padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.stat b { font: 600 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.week { padding-top: 30px; display: grid; gap: 14px; }
.week-head { display: flex; align-items: baseline; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.tile { display: grid; gap: 14px; align-content: start; text-align: left; background: var(--surface); border: 1px solid transparent; border-radius: var(--r); padding: 16px; cursor: pointer; text-decoration: none; transition: transform .18s ease, border-color .18s ease, background .18s ease; min-width: 0; }
.tile:hover { border-color: var(--line); background: var(--surface-2); transform: translateY(-2px); }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.teams { display: grid; gap: 6px; }
.team-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.team-row .nm { font: 600 18px/1.15 var(--font-display); }
.team-row .ab { font: 500 12px/1 var(--font-mono); color: var(--faint); margin-left: 6px; }
.team-row .pts { font: 600 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.team-row.lost .nm, .team-row.lost .pts { color: var(--faint); }
.proj .pts { color: var(--muted); font-weight: 500; }
.tile-foot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.tile-foot .pickline { color: var(--ink); font-weight: 500; }
.quick-list { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); text-decoration: none; cursor: pointer; }
.quick:first-child { border-top: 0; }
.quick:hover { background: var(--surface); }
.quick .score { font-size: 13px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.pick { background: var(--pick); color: var(--pick-ink); }
.pill.held { background: var(--held-bg); color: var(--held); }
.pill.win { background: var(--win-bg); color: var(--win); }
.pill.loss { background: var(--loss-bg); color: var(--loss); }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.back { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; font-size: 14px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--ink); }
.board { margin-top: 18px; display: grid; gap: 18px; padding: 22px; border-radius: calc(var(--r) + 4px); background: var(--surface); }
.board-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.board-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.right { text-align: right; }
.side .nm { font: 600 clamp(22px, 4.5vw, 34px)/1.05 var(--font-display); }
.side .pts { font: 600 clamp(40px, 9vw, 72px)/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.board.projected .side .pts { color: var(--muted); }
.side.lost .pts, .side.lost .nm { color: var(--faint); }
.vs { font: 500 12px/1 var(--font-mono); color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
.board-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.board-meta b { color: var(--ink); font-weight: 500; }
.headline { font: 500 clamp(18px, 2.6vw, 22px)/1.35 var(--font-display); max-width: 60ch; }
.section { margin-top: 34px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.section-head p { color: var(--muted); font-size: 13px; max-width: 60ch; }
.pickcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; padding: 20px; border: 1.5px solid var(--ink); border-radius: var(--r); }
.pickcard .bet { font: 600 clamp(22px, 4vw, 28px)/1.1 var(--font-display); margin-top: 6px; }
.pickcard .cat { color: var(--muted); margin-top: 6px; font-size: 13px; }
.price { font: 600 28px/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.price small { display: block; font: 400 12px/1.4 var(--font-body); color: var(--muted); margin-top: 6px; }
.facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.fact { display: grid; gap: 5px; align-content: start; }
.fact b { font: 600 17px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.fact small { color: var(--muted); font-size: 12px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 3px; }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--faint); }
.empty { padding: 18px 20px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 16px; background: var(--surface); border-radius: 12px; }
.row b { font-weight: 600; }
.row .why { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.row details { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
summary { cursor: pointer; color: var(--ink); font-size: 13px; }
.row .right { text-align: right; display: grid; gap: 6px; justify-items: end; align-content: start; }
.more { padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; }
.more .list { margin-top: 10px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.stack { display: grid; align-content: start; min-width: 0; }
.inj { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.inj:last-child { border-bottom: 0; }
.inj span { color: var(--muted); }
.inj > span:last-child { text-align: right; }
.fine { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 10px; color: var(--muted); font-size: 13px; }
.fine ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.fine code { font: 12px var(--font-mono); word-break: break-all; color: var(--ink); }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.parlay { display: grid; gap: 14px; padding: 18px; border-radius: var(--r); background: var(--surface); }
.parlay-top { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.parlay .legs { background: var(--bg); }
.lc { display: none; }
.mkt { border-top: 1px solid var(--line); }
.mrow { border-bottom: 1px solid var(--line); }
.mrow > summary { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 2px; cursor: pointer; list-style: none; }
.mrow > summary::-webkit-details-marker { display: none; }
.mrow > summary::after { content: "+"; grid-column: 4; color: var(--muted); font-family: var(--font-mono); }
.mrow[open] > summary::after { content: "–"; }
.mcat { font-weight: 600; }
.mtop .sub { display: block; }
.mpct { font-size: 18px; font-weight: 500; }
.mrow .table-wrap { margin: 0 0 14px; }
@media (max-width: 760px) { .mrow > summary { grid-template-columns: 1fr auto auto; } .mcat { grid-column: 1 / -1; } }
@media (max-width: 760px) { .lc { display: inline; color: var(--muted); font-family: var(--font-body); } }
.parlay .why { color: var(--muted); font-size: 13px; }
.hero { padding-block: 34px 18px; display: grid; gap: 10px; }
.hero h1 { font: 600 clamp(34px, 6vw, 52px)/1.02 var(--font-display); letter-spacing: -0.02em; }
.hero .lede { color: var(--muted); max-width: 60ch; font-size: 16px; }
.slate { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-bottom: 30px; }
.mptile { display: grid; gap: 12px; align-content: start; padding: 18px; border-radius: calc(var(--r) + 2px); background: var(--surface); text-decoration: none; border: 1px solid transparent; transition: transform .15s, border-color .15s; }
.mptile:hover { border-color: var(--line); transform: translateY(-2px); }
.mpt-teams { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 600 22px/1.15 var(--font-display); }
.mpt-teams .at { font: 500 12px/1 var(--font-mono); color: var(--faint); text-transform: uppercase; }
.mpt-line { font-size: 12px; color: var(--muted); }
.mpt-picks { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.mpt-picks li { font-weight: 500; font-size: 14px; }
.mpt-picks li::before { content: "→ "; color: var(--faint); }
.mpt-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.week-block { margin-top: 30px; }
.week-head h3 { font: 600 18px/1.2 var(--font-display); }
.drawer { margin-top: 34px; border: 1px solid var(--line); border-radius: var(--r); }
.drawer > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.drawer > summary::-webkit-details-marker { display: none; }
.drawer > summary::after { content: "+"; font: 500 18px/1 var(--font-mono); color: var(--muted); }
.drawer[open] > summary::after { content: "–"; }
.drawer > summary b { font: 600 16px/1.2 var(--font-display); }
.drawer-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }
.drawer-body .stats { margin-top: 18px; }
.drawer-body .ptrack { margin-top: 18px; }
.tdgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tdcard { display: grid; gap: 8px; padding: 16px; border-radius: var(--r); background: var(--surface); }
.tdcard b { font: 600 19px/1.15 var(--font-display); }
.tdcard small { color: var(--muted); font-size: 12px; }
.tdprice { font-size: 20px; font-weight: 500; }
.tally { color: var(--ink); font-weight: 600; }
.mp-row .res { display: grid; justify-items: end; gap: 4px; }
.mp-list .mp-row b { font-size: 15px; }

.mp-list { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.mp-row:first-child { border-top: 0; }
.mp-row b { font-weight: 600; }
.mp-row .num { text-align: right; min-width: 64px; }
.mp-row .num small { display: block; color: var(--muted); font-size: 12px; }
.bands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.band { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.band-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.band-top b { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
.band ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.band li { font-size: 14px; }
.band li span { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.mrec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.pill.mkt-pill { background: var(--surface-2); }
.ptrack { display: grid; gap: 14px; padding-block: 4px 26px; }
.pt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.pt-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.pt-list { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.pt-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); text-decoration: none; }
.pt-row:first-child { border-top: 0; }
.pt-row:hover { background: var(--surface); }
.pt-name b { font-weight: 600; }
.pt-price { font-size: 13px; }
.view { animation: rise .35s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } .tile { transition: none; } .tile:hover { transform: none; } }
@media (max-width: 760px) {
  .intro { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 26px 18px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .pickcard { grid-template-columns: minmax(0, 1fr); }
  .price { text-align: left; }
  .board { padding: 18px; }
  .board-teams { gap: 10px; }
  .quick { grid-template-columns: minmax(0, 1fr) auto; }
  .quick .score { grid-column: 1 / -1; grid-row: 2; }
  .stat { padding: 12px; }
  .stat b { font-size: 20px; }
  .legtbl thead { display: none; }
  .legtbl tr { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 6px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .legtbl tr:last-child { border-bottom: 0; }
  .legtbl td { padding: 0; border: 0; }
  .legtbl td:nth-child(1) { grid-column: 1 / -1; }
  .legtbl td:nth-child(4) { justify-self: end; }
  .parlay-top { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .parlay { padding: 14px; }
  .pt-grid { grid-template-columns: minmax(0, 1fr); }
  .bands, .mrec, .tdgrid { grid-template-columns: minmax(0, 1fr); }
  .cats thead { display: none; }
  .cats tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .cats tr:last-child { border-bottom: 0; }
  .cats td { padding: 0; border: 0; }
  .cats td:nth-child(1) { grid-column: 1 / 4; font-weight: 600; }
  .cats td:nth-child(2) { grid-column: 4; justify-self: end; }
  .cats td:nth-child(3) { grid-column: 1 / -1; }
  .cats td:nth-child(4) { grid-column: 1; text-align: left; }
  .cats td:nth-child(5)::after { content: " chance"; color: var(--muted); font-family: var(--font-body); }
  .cats td:nth-child(6)::after { content: " edge"; color: var(--muted); font-family: var(--font-body); }
  .cats td:nth-child(7) { justify-self: end; }
  .cats tr.fr td:nth-child(4), .cats tr.fr td:nth-child(5), .cats tr.fr td:nth-child(6) { display: none; }
  .cats tr.fr td:nth-child(7) { grid-column: 4; }
}
</style>
</head>

<div class="wrap">

const wl = s => `${s.W}-${s.L}` + (s.P ? `-${s.P}` : "");
const clvTxt = s => s.mean_dk_clv_novig_pts == null ? "CLV not in yet" : `CLV ${s.mean_dk_clv_novig_pts >= 0 ? "+" : "−"}${Math.abs(s.mean_dk_clv_novig_pts).toFixed(1)} pts (${s.n_clv})`;
function marketRecord(m) {
  if (!m) return `<section class="ptrack" aria-label="Market picks record">
    <div class="section-head"><h2>Market picks record</h2><p>Kept apart from the retired v1 record.</p></div>
    <div class="empty">No market picks graded yet. The record fills in as games finish.</div></section>`;
  const box = (name, s) => `<div class="stat"><span class="label">${name}</span><b>${wl(s)}</b><small>${units(s.units)}${s.pending ? ` · ${s.pending} pending` : ""}${s.not_on_card ? ` · ${s.not_on_card} ungraded` : ""}<br>${clvTxt(s)}</small></div>`;
  return `<section class="ptrack" aria-label="Market picks record">
    <div class="section-head"><h2>Market picks record</h2><p>${MP_NOTE} 1 paper unit each, ${m.games} game${m.games !== 1 ? "s" : ""} since 6 Nov. CLV is how far DraftKings' no-vig chance moved toward us by kickoff.</p></div>
    <div class="mrec">${box("Picks", m.picks)}${box("Touchdown picks", m.td_picks)}${box("Band parlays", m.parlays)}</div>
  </section>`;
}
const MP_NOTE = "Market picks, no edge claimed. Never pooled with the v1 0-5.";

function marketPicksSection(g) {
  const m = g.market_picks;
  if (!m) return "";
  const row = r => `<div class="mp-row">
      <div><b>${esc(r.label)}</b><span class="sub">${esc(r.category)} · DraftKings · ${when(r.capture_utc)}</span></div>

      <div>${resultPill(r.result)}${r.clv_pts != null ? `<span class="sub mono">CLV ${r.clv_pts >= 0 ? "+" : "−"}${Math.abs(r.clv_pts).toFixed(1)}</span>` : ""}</div>
    </div>`;
  const board = m.td_board.filter(r => !r.dst).slice(0, 12);
  return `<section class="section">
      <div class="section-head"><h2>Market picks</h2><p><span class="pill mkt-pill">${esc(m.label)}</span> The side DraftKings rates most likely in each market, using only lines with both sides posted. 1 paper unit each. Every one carries DraftKings' margin.</p></div>

    </section>
    <section class="section">
      <div class="section-head"><h2>Band parlays</h2><p>One per price band, built only from the picks above. The price multiplies DraftKings' single-leg prices and ignores how legs move together, so DraftKings' own same-game price will differ.</p></div>
      <div class="bands">${m.parlays.map(p => p.legs.length ? `<div class="band">

function parlayTracker(pt) {
  if (!pt || !pt.summary.count) return "";

  return `<section class="ptrack" aria-label="Parlay tracker">
    <div class="section-head"><h2>Parlay tracker <span class="pill">Retired 2 Nov</span></h2><p>Hypothetical v1 parlays, 1 unit each, kept as a record. They stopped after the model audit because their chances aren't validated. A same-day parlay shared by several games counts once; pushed legs drop out of the payout.</p></div>
    <div class="pt-grid">
      <div class="pt-stats">
        <div class="stat"><span class="label">Record</span><b>${s.wins}-${s.losses}</b><small>${units(s.units)}${s.pending ? ` · ${s.pending} pending` : ""}</small></div>
        <div class="stat"><span class="label">Hit rate</span><b>${pct(s.hit_rate)}</b><small>We expected ${pct(s.expected_hit_rate)}. The prices implied ${pct(s.implied_hit_rate)}.</small></div>
        <div class="stat"><span class="label">Average price</span><b>${esc(s.avg_price)}</b><small>${s.count} parlays</small></div>
        <div class="stat"><span class="label">Legs won</span><b>${legPct}</b><small>${s.legs_won} of ${s.legs_graded} legs</small></div>
      </div>

        <span class="mono pt-price">${esc(r.price)}</span>
        ${resultPill(r.result)}
      </a>`).join("")}</div>
    </div>
  </section>`;
}

function tile(g) {
  const pk = g.record.picks;
  const mpk = g.market_picks;
  const pickLine = mpk
    ? `<span class="pickline">${mpk.picks} picks · ${mpk.td_picks} TD · ${mpk.parlays} parlays${tallyTxt(mpk.tally.picks) ? ` · picks ${tallyTxt(mpk.tally.picks)}` : ""}</span>`
    : MO(g)
    ? `<span>Market only${g.shadow_count ? ` · v1 shadow flagged ${g.shadow_count}, not picks` : ""}</span>`
    : g.pick_labels.length
    ? `<span class="pickline">Pick: ${esc(g.pick_labels.join(" · "))}</span>`
    : `<span>No paper pick${g.counts.cleared_bar ? ` · ${g.counts.cleared_bar} held back` : ""}</span>`;
  const res = g.pick_labels.length && (pk.wins + pk.losses) ? ` · picks ${rec(pk)} (${units(pk.units)})` : "";
  return `<a class="tile" href="#${g.route}">
    <div class="tile-top"><span class="label">${when(g.kickoff_utc)}</span>${statePill(g)}</div>
    ${teamRows(g)}
    <div class="tile-foot">${pickLine}<span>${g.final_score ? "Final score" : mpk ? `DraftKings ${esc(lineTxt(mpk.line))}` : MO(g) ? "v1 shadow projection" : "Our projected score"}${res}</span></div>
  </a>`;
}
function quickRow(g) {

}

function meter(r) {
  const c = Math.max(0, Math.min(1, r.chance || 0)), m = Math.max(0, Math.min(1, r.dk_chance || 0));
  return `<div class="meter" role="img" aria-label="Our chance ${pct(c)}, DraftKings ${pct(m)}"><i style="width:${c * 100}%"></i><u style="left:calc(${m * 100}% - 1px)"></u></div>`;
}

        <div class="band-top"><span class="label">${esc(p.band)}</span>${resultPill(p.result)}</div>
        <div class="band-top"><b>${esc(p.price)}</b><span class="mono" style="color:var(--muted);font-size:12px">${pct(p.chance)} if independent</span></div>
        <ol>${p.legs.map(l => `<li>${esc(l.label)} <span>${esc(l.price)}${l.result && l.result !== "pending" ? " · " + esc(l.result) : ""}</span></li>`).join("")}</ol>
      </div>` : `<div class="band"><span class="label">${esc(p.band)}</span><p class="why">${esc(p.note)}</p></div>`).join("")}</div>
    </section>

    ${notes.length ? `<section class="section"><h2>What to know</h2>
      <ul class="notes">${notes.slice(0, 2).map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      ${notes.length > 2 ? `<details class="more"><summary>${notes.length - 2} more notes</summary><ul class="notes" style="margin-top:10px">${notes.slice(2).map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>` : ""}
    </section>` : ""}

    <details class="drawer">
      <summary><span><b>Details</b><span class="sub">DraftKings reference for every market, the full touchdown board, the old model in shadow, injuries and the record of this card.</span></span></summary>
      <div class="drawer-body">
        ${MO(g) ? marketSections(g) : ""}
        <section class="section">
          <div class="section-head"><h2>Anytime touchdown board</h2><p>Each price scaled so the field adds up to the usual number of scorers for a ${m.td_reference?.game_total ?? "–"}-point game. Estimates.</p></div>
          <div class="table-wrap"><table><thead><tr><th>Player</th><th class="num">Price</th><th class="num">Estimate</th><th></th></tr></thead>
          <tbody>${board.map(r => `<tr><td>${esc(r.player)}</td><td class="num mono">${esc(r.price)}</td><td class="num mono">${pct(r.fair)}</td><td>${r.pick ? `<span class="pill pick">TD pick</span>` : ""}</td></tr>`).join("")}</tbody></table></div>
        </section>
        ${g.injuries.length ? `<section class="section">
          <div class="section-head"><h2>Injury watch</h2><p>As known when the card was locked.</p></div>
          <div>${g.injuries.map(i => `<div class="inj"><b style="font-weight:500">${esc(i.player)} <span>${esc(i.team)} ${esc(i.position || "")}</span></b><span>${esc(i.status)}${i.note ? " · " + esc(i.note) : ""}</span></div>`).join("")}</div>
        </section>` : ""}
        <footer class="fine">
          <span class="label">Record of this card</span>
          <span>Picks file <code>${esc(m.file)}</code></span>
          <span>SHA-256 <code>${esc(m.sha256)}</code></span>
          <span>Ledger entry <code>${esc(g.decision.entry)}</code>, locked ${when(g.decision.run_time_utc)}${g.decision.pre_kickoff ? ", before kickoff" : ""}. Paper only, not actionable.</span>
          <ul>${DATA.index.limits.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
        </footer>
      </div>
    </details>
  </div>`;
}

function marketSections(g) {
  const sh = g.shadow || [];
  return `<section class="section">
      <div class="section-head"><h2>DraftKings reference</h2><p>No picks under the market-only setup. For each market, the chance DraftKings' prices imply once the bookmaker's margin is taken out (no-vig). That needs both sides from DraftKings, so one-sided markets and other books show their price, book and time with no reference chance.</p></div>
      <div class="mkt">${g.market.map(c => { const t = c.top; return `<details class="mrow">
        <summary><span class="mcat">${esc(c.category)}</span>
          <span class="mtop">${t ? `${esc(lbl(t))} <span class="mono">${esc(t.price)}</span><span class="sub">Most likely line · ${c.lines} line${c.lines !== 1 ? "s" : ""}, ${c.no_vig_lines} two-sided</span>` : `No reference<span class="sub">${c.lines} line${c.lines !== 1 ? "s" : ""}, none two-sided on DraftKings. Prices only.</span>`}</span>
          <span class="mono mpct">${t ? pct(t.ref_chance) : "–"}</span></summary>
        <div class="table-wrap"><table class="mtbl"><thead><tr><th>Line</th><th class="num">Price</th><th class="num">DK chance</th><th>Result</th></tr></thead>
        <tbody>${c.rows.map(r => `<tr><td>${esc(lbl(r))}<span class="sub">${esc(BASIS[r.dk_basis] || r.dk_basis)} · ${priceLine(r)}</span></td><td class="num mono">${esc(r.price || "–")}</td><td class="num mono">${pct(r.ref_chance)}</td><td>${resultPill(r.result)}</td></tr>`).join("")}</tbody></table></div>
      </details>`; }).join("")}</div>
    </section>
    <section class="section">
      <div class="section-head"><h2>v1 in shadow</h2><p>The old model still runs so it can be scored against the market. What it would have picked is shown here and is not a pick.</p></div>
      ${sh.length ? `<div class="list">${sh.map(r => `<div class="row">
        <div><b>${esc(lbl(r))}</b> <span class="mono" style="color:var(--muted)">${esc(r.price)}</span> <span class="pill held">${esc(r.shadow_label)}</span><span class="sub">${esc(r.category)} · ${priceLine(r)}</span></div>
        <div class="right">${resultPill(r.result)}<span class="mono" style="font-size:12px;color:var(--muted)">v1 ${pct(r.chance)} vs DK ${pct(r.ref_chance)}</span></div></div>`).join("")}</div>`
        : `<div class="empty">v1 flagged nothing for this game.</div>`}
    </section>`;
}

function pickCard(r) {
  return `<article class="pickcard">
    <div><span class="label">${esc(r.category)}</span><div class="bet">${esc(lbl(r))}</div><p class="cat">${priceLine(r)}</p></div>
    <div class="price">${esc(r.price)}<small>${esc(r.book)}</small></div>
    <div class="facts">
      <div class="fact"><span class="label">Our chance</span><b>${pct(r.chance)}</b>${meter(r)}<small>DraftKings says ${pct(r.dk_chance)}</small></div>
      <div class="fact"><span class="label">Edge</span><b>${edge(r.edge)}</b><small>Expected return per unit</small></div>
      <div class="fact"><span class="label">Still a pick down to</span><b>${esc(r.worst_price || "–")}</b><small>Pass if the price gets worse</small></div>
      <div class="fact"><span class="label">Stake</span><b>${r.paper_units} paper unit</b><small>${r.kelly_pct_hypothetical != null ? `Flat stake. Quarter-Kelly calculation: ${r.kelly_pct_hypothetical}% (hypothetical, never applied)` : "Flat stake"}</small></div>
      <div class="fact"><span class="label">Result</span><span>${resultPill(r.result)}</span><small>${r.result !== "pending" && r.units != null ? units(r.units) : ""}</small></div>
    </div>
  </article>`;
}
function heldRow(r) {
  return `<div class="row">
    <div><b>${esc(lbl(r))}</b> <span class="mono" style="color:var(--muted)">${esc(r.price)}</span><span class="sub">${esc(r.category)} · ${priceLine(r)}</span></div>
    <div class="right">${resultPill(r.result)}<span class="mono" style="font-size:12px;color:var(--muted)">${pct(r.chance)} vs DK ${pct(r.dk_chance)}</span></div>
    <p class="why">${esc(r.why_not)}</p>
    ${r.review_note && r.review_note !== r.why_not ? `<details><summary>Reviewer's note</summary><p style="margin-top:6px">${esc(r.review_note)}</p></details>` : ""}
  </div>`;
}

let lastHash = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && byRoute[h]) renderGame(byRoute[h]); else renderHome();
  if (lastHash !== null && lastHash !== h) window.scrollTo(0, 0);
  lastHash = h;
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
